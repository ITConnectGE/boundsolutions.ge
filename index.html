    <!-- Consent Mode. Everything is denied before Tag Manager loads, so no tag
         inside the container (Google Analytics among them) may run until the
         visitor agrees. src/composables/consent.js flips this to "granted" and
         remembers the answer; a visitor who already agreed starts granted, so
         nothing flickers. This defines gtag() only - it loads no analytics. -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        var answer = null;
        try { answer = localStorage.getItem('bs-cookie-consent'); } catch (e) { /* storage blocked */ }
        var state = answer === 'granted' ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: state,
          ad_user_data: state,
          ad_personalization: state,
          analytics_storage: state,
          wait_for_update: 500
        });
      })();
    </script>

    <!-- Google Tag Manager: placed as high in the head as possible, per Google.
         Not loaded on localhost or the admin portal, so neither pollutes the data.
         The Meta Pixel is not here: it loads from consent.js, after consent. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.indexOf('portal.') === 0) return;
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-PQQVVZVJ');
      })();
    </script>
    <!-- End Google Tag Manager -->
