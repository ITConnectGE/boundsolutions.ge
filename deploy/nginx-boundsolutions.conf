# boundsolutions.ge — Laravel public/ is the single web root, serving BOTH the
# Vue SPA (index.html) and the API (/api -> Laravel front controller).
# The built Vue dist is copied into backend/public by deploy/server-setup.sh.
# Independent of the gudaurilodge vhost (matched by server_name).
server {
    listen 80;
    listen [::]:80;
    server_name boundsolutions.ge www.boundsolutions.ge;
    client_max_body_size 25M;

    root /srv/bound/backend/public;
    index index.html index.php;

    # API -> Laravel front controller
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vue SPA (everything else) + static assets + /storage symlink
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP via php-fpm 8.4
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # deny dotfiles (except ACME challenge)
    location ~ /\.(?!well-known).* { deny all; }
}
