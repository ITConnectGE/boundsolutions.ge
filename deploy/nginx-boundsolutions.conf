# boundsolutions.ge - frontend and backend kept in SEPARATE folders:
#   /srv/bound/dist      = built Vue site (web)   -> served at /
#   /srv/bound/backend   = Laravel (api)          -> served at /api  (direct fastcgi)
# Independent of the gudaurilodge vhost (matched by server_name).
#
# Apply with: sudo bash deploy/apply-nginx.sh  (backs up, installs SSL without
# certbot's own redirect, tests, reloads, and restores the backup on failure).

# ---- Canonical URLs --------------------------------------------------------------
# One URL per page: https://boundsolutions.ge/<path>/  - https, no www, trailing
# slash. The sitemap, canonical tags and internal links all use exactly that form
# (src/utils/url.js). Every other variant - http, www, a missing slash, a direct
# /index.html - gets ONE 301 straight to the final URL, never a chain. That is also
# why SSL is installed with certbot --no-redirect: certbot's http->https redirect
# keeps the host and path unchanged, so it would add a hop in front of this one.

# Request path without the query string, exactly as the visitor sent it. Based on
# $request_uri, so the internal redirects done by index/try_files don't affect it.
map $request_uri $bs_path {
    "~^(?<bs_p>[^?]*)"  $bs_p;
}

# The scheme the VISITOR used. Cloudflare terminates TLS in front of nginx and
# reports it in CF-Visitor ({"scheme":"https"}); a direct hit falls back to $scheme.
map $http_cf_visitor $bs_scheme {
    default   $scheme;
    ~https    https;
    ~http     http;
}

# Only the site's own hostnames are canonicalised; anything else is left alone.
# (Regex keys throughout: they don't depend on map_hash_bucket_size.)
map $host $bs_known_host {
    default                        0;
    "~^(www\.)?boundsolutions\.ge$" 1;
}

# 1 = a page path missing its trailing slash. Files (any extension) are fine.
map $bs_path $bs_add_slash {
    default                  1;
    "~/$"                    0;
    "~\.[A-Za-z0-9]{1,10}$"  0;
}

map $bs_add_slash $bs_slash {
    default  "";
    1        "/";
}

# Never redirected: the API and the Mailgun webhook (a redirected POST is lost),
# uploaded files, and /admin (it has its own single redirect to the portal).
map $bs_path $bs_skip {
    default                                          0;
    "~^/(api|laravel-mailbox|storage|admin)(/|$)"    1;
}

# 1 = not on the canonical URL -> redirect.
map "$bs_skip:$bs_known_host:$bs_scheme:$host:$bs_add_slash" $bs_redirect {
    default                                 1;
    "~^1:"                                  0;
    "~^0:0:"                                0;
    "~^0:1:https:boundsolutions\.ge:0$"     0;
}

# "/index.html" or "/x/index.html" -> the directory it duplicates ("/" or "/x/").
map "$bs_known_host:$bs_path" $bs_index_dir {
    default                           "";
    "~^1:(?<bs_d>.*/)index\.html$"    $bs_d;
}

# ---- Reject unknown hostnames (so random subdomains don't serve the site) ----
# Without this, the first server block becomes nginx's default and answers every
# Host header. Only boundsolutions.ge and portal.boundsolutions.ge are served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name boundsolutions.ge www.boundsolutions.ge;
    client_max_body_size 25M;

    # ---- Canonical redirects (see the maps at the top): one hop, permanent ----
    # The index.html check comes first so http://www.../index.html is also a
    # single hop to https://boundsolutions.ge/.
    if ($bs_index_dir) {
        return 301 https://boundsolutions.ge$bs_index_dir$is_args$args;
    }
    if ($bs_redirect) {
        return 301 https://boundsolutions.ge$bs_path$bs_slash$is_args$args;
    }

    # ---- Frontend (built Vue site) ----
    root /srv/bound/dist;
    index index.html;

    # ---- Backend API (Laravel front controller, separate folder) ----
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bound/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ---- Inbound email webhook (Mailgun route -> laravel-mailbox) ----
    location ^~ /laravel-mailbox {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bound/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ---- Uploaded files (CV / images) from Laravel storage ----
    location ^~ /storage/ {
        alias /srv/bound/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ---- Admin lives ONLY on the portal subdomain ----
    location ^~ /admin {
        return 301 https://portal.boundsolutions.ge$request_uri;
    }

    # Build artefacts that must not be reachable as pages of their own (they
    # would be duplicates of the homepage). app-shell.html is still used below
    # as the internal SPA fallback; 404.html only exists for GitHub Pages.
    location = /app-shell.html {
        internal;
    }
    location = /404.html {
        internal;
    }

    # ---- Vue SPA fallback (client-side routing) ----
    # Prerendered routes are served by try_files ($uri / $uri/) first; only
    # NON-prerendered routes (e.g. /vacancies/:id/) reach the fallback - send them
    # to the content-less shell, not the prerendered homepage, so they don't flash
    # the homepage before the router mounts.
    location / {
        try_files $uri $uri/ /app-shell.html;
    }
}

# ---- Admin portal: portal.boundsolutions.ge -> the same app, lands on /admin ----
# Same dist + same Laravel API (token auth, so same-origin /api works with no CORS).
server {
    listen 80;
    listen [::]:80;
    server_name portal.boundsolutions.ge;
    client_max_body_size 25M;

    # The admin panel is https-only (certbot is run with --no-redirect).
    if ($bs_scheme = http) {
        return 301 https://portal.boundsolutions.ge$request_uri;
    }

    root /srv/bound/dist;
    index index.html;

    # Backend API (shared Laravel app)
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bound/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # ---- Inbound email webhook (Mailgun route -> laravel-mailbox) ----
    location ^~ /laravel-mailbox {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bound/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Uploaded files (CV / images)
    location ^~ /storage/ {
        alias /srv/bound/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # The portal exists for the admin - land visitors on the login.
    location = / {
        return 302 /admin/login;
    }

    # SPA fallback -> the content-less shell (NOT index.html), so admin routes
    # don't flash the prerendered homepage before the router mounts.
    location / {
        try_files $uri /app-shell.html;
    }
}
