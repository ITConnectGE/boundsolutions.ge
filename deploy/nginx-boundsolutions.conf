# boundsolutions.ge — Vue SPA (static) + Laravel API on one domain.
# Frontend build lives in /srv/bound/dist; Laravel in /srv/bound/backend.
# This vhost is independent of the gudaurilodge vhost (matched by server_name).
server {
    listen 80;
    listen [::]:80;
    server_name boundsolutions.ge www.boundsolutions.ge;
    client_max_body_size 25M;

    root /srv/bound/dist;
    index index.html;

    # ---- Laravel API (/api/*) ----
    # Scoped copy of the canonical Laravel config: backend/public as root,
    # try_files to the front controller, PHP handled by php-fpm.
    location ^~ /api {
        root /srv/bound/backend/public;
        try_files $uri $uri/ /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
        }
    }

    # ---- Uploaded files (CV / images) via storage symlink ----
    location ^~ /storage/ {
        root /srv/bound/backend/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ---- Vue SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
